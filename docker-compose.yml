# 深空辐照标定封存服务 —— Compose 编排
#
# 交付：
#   web     页面 + 健康响应 + 真实投票/封存 API，宿主端口可用 WEB_PORT 配置（默认 8080）
#   verify  等 web 健康检查通过后执行验收，覆盖幂等重传、冲突票隔离、
#           页面构建、健康冒烟、并发封签唯一性与重启恢复，完成即以退出码报告
#
# 常用：
#   WEB_PORT=9090 docker compose up --build --abort-on-container-exit --exit-code-from verify
#   （验收通过后 web 仍可继续提供页面；单独复跑：docker compose run --rm verify）

services:
  web:
    build:
      context: ./web
    image: irradiation-seal-web:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      SEAL_HOST: 0.0.0.0
      SEAL_PORT: "8080"
      DATA_DIR: /data
    volumes:
      - seal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3); sys.exit(0 if r.status==200 and json.load(r)['status']=='ok' else 1)"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 20

  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: irradiation-seal-verify:latest
    environment:
      BASE_URL: http://web:8080
      APP_PATH: /app/server.py
      SOURCE_DATA_DIR: /data
      RESTART_ROOT: /tmp/restart
    volumes:
      - seal-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

volumes:
  seal-data:
